spring.application.name=chat-backend
server.port=${PORT:8080}

agent.version=0.2.0
agent.environment=${ENVIRONMENT:local}
agent.frontend-origin=${AGENT_FRONTEND_ORIGIN:http://localhost:3000}
agent.file-upload-model-id=${AGENT_FILE_UPLOAD_MODEL_ID:openai/gpt-oss-120b:free}
agent.allowed-model-ids=${ALLOWED_MODEL_IDS:}
agent.model-catalog-dynamic-enabled=${MODEL_CATALOG_DYNAMIC_ENABLED:true}
agent.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
agent.internal-api-secret=${INTERNAL_API_SECRET:}
agent.rate-limit-enabled=${RATE_LIMIT_ENABLED:true}
agent.rate-limit-chat-per-minute=${RATE_LIMIT_CHAT_PER_MINUTE:10}
agent.rate-limit-chat-user-per-minute=${RATE_LIMIT_CHAT_USER_PER_MINUTE:20}
agent.rate-limit-global-per-minute=${RATE_LIMIT_GLOBAL_PER_MINUTE:60}
agent.rate-limit-block-seconds=${RATE_LIMIT_BLOCK_SECONDS:300}
agent.max-request-body-bytes=${MAX_REQUEST_BODY_BYTES:1048576}
agent.max-message-chars=${MAX_MESSAGE_CHARS:12000}
agent.max-messages-per-request=${MAX_MESSAGES_PER_REQUEST:40}
agent.max-title-chars=${MAX_TITLE_CHARS:64}

spring.datasource.url=${DATABASE_URL:${AGENT_DB_URL:jdbc:h2:file:./data/agentdb;AUTO_SERVER=TRUE}}
spring.datasource.username=${DATABASE_USERNAME:${AGENT_DB_USERNAME:sa}}
spring.datasource.password=${DATABASE_PASSWORD:${AGENT_DB_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME_MS:600000}
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:0}

spring.servlet.multipart.max-file-size=${MAX_REQUEST_BODY_BYTES:1048576}B
spring.servlet.multipart.max-request-size=${MAX_REQUEST_BODY_BYTES:1048576}B

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
spring.mvc.async.request-timeout=${REQUEST_TIMEOUT_MS:120000}
server.tomcat.connection-timeout=${SERVER_CONNECTION_TIMEOUT:20s}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoints.web.base-path=/actuator

logging.level.com.fachat.agent=INFO
